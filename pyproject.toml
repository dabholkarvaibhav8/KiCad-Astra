[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "dist", "build"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["gui: requires Tk and a desktop display", "native: requires KiCad and opt-in", "native_cli: requires the native CLI and fixture Python", "live_api: explicitly enabled, potentially billed API test"]
[tool.coverage.run]
branch = true
source = ["agent", "kicad", "ui", "support"]
[tool.coverage.report]
show_missing = true
