name: Bug report
description: A reproducible KiCad Astra failure
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: environment
    attributes:
      label: Versions and operating system
      placeholder: KiCad Astra version, KiCad build, Python version, OS
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
      description: Include the stage and the smallest disposable board that reproduces it, if you can share it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics and DRC evidence
      description: Attach doctor output and relevant session or DRC reports. Remove credentials and private design data.
  - type: dropdown
    id: native
    attributes:
      label: How was this tested?
      options:
        - Demo or simulated IPC
        - Native KiCad CLI
        - Live KiCad editor
        - Live hosted API
